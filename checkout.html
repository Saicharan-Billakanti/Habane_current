<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Checkout — HABÄNE</title>
  <meta name="description" content="Complete your HABÄNE order. Secure checkout powered by Stripe." />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css?v=150" />
  <style>
    .checkout-page { min-height: 100vh; background: var(--color-midnight, #060935); color: #fff; padding: 120px 24px 80px; }
    .checkout-page__inner { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 1fr 420px; gap: 48px; }
    @media (max-width: 860px) { .checkout-page__inner { grid-template-columns: 1fr; } }

    .checkout-form-wrap { order: 1; }
    .checkout-summary-wrap { order: 2; }

    .checkout-section { margin-bottom: 36px; }
    .checkout-section__title { font-family: var(--font-heading, 'Montserrat', sans-serif); font-size: 11px; letter-spacing: .15em; text-transform: uppercase; opacity: .55; margin-bottom: 16px; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-row--single { grid-template-columns: 1fr; }
    @media (max-width: 480px) { .form-row { grid-template-columns: 1fr; } }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; opacity: .5; }
    .form-group input, .form-group select {
      background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.15);
      color: #fff; padding: 14px 16px; border-radius: 8px;
      font-family: var(--font-ui, 'Inter', sans-serif); font-size: 14px;
      transition: border-color .2s;
    }
    .form-group input::placeholder { opacity: .35; }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: rgba(255,255,255,.45); }
    .form-group select option { background: #060935; }

    .checkout-divider { height: 1px; background: rgba(255,255,255,.1); margin: 28px 0; }

    .discount-row { display: flex; gap: 10px; margin-top: 6px; }
    .discount-row input { flex: 1; }
    .discount-row button { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2); color: #fff; padding: 0 18px; border-radius: 8px; font-family: var(--font-ui, sans-serif); font-size: 13px; cursor: pointer; white-space: nowrap; transition: background .2s; }
    .discount-row button:hover { background: rgba(255,255,255,.22); }
    .discount-msg { font-size: 12px; margin-top: 6px; }
    .discount-msg.is-valid { color: #4ade80; }
    .discount-msg.is-invalid { color: #f87171; }

    .checkout-submit { width: 100%; padding: 18px 28px; background: #fff; color: #060935; border: none; border-radius: 10px; font-family: var(--font-heading, 'Montserrat', sans-serif); font-size: 15px; font-weight: 700; letter-spacing: .06em; cursor: pointer; transition: opacity .2s, transform .15s; margin-top: 24px; }
    .checkout-submit:hover { opacity: .9; transform: translateY(-1px); }
    .checkout-submit:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    .checkout-notice { font-size: 12px; opacity: .4; text-align: center; margin-top: 14px; line-height: 1.5; }
    .checkout-error { background: rgba(248,113,113,.12); border: 1px solid rgba(248,113,113,.3); border-radius: 8px; padding: 14px 18px; font-size: 13px; color: #fca5a5; margin-top: 16px; display: none; }

    /* Summary sidebar */
    .checkout-summary { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: 14px; padding: 28px; position: sticky; top: 100px; }
    .checkout-summary__title { font-family: var(--font-heading, 'Montserrat', sans-serif); font-size: 12px; letter-spacing: .15em; text-transform: uppercase; opacity: .45; margin-bottom: 20px; }
    .checkout-summary__items { display: flex; flex-direction: column; gap: 14px; margin-bottom: 20px; }
    .checkout-item { display: flex; gap: 12px; align-items: flex-start; }
    .checkout-item__img { width: 52px; height: 52px; border-radius: 6px; object-fit: cover; background: rgba(255,255,255,.08); flex-shrink: 0; }
    .checkout-item__img-placeholder { width: 52px; height: 52px; border-radius: 6px; background: rgba(255,255,255,.08); flex-shrink: 0; }
    .checkout-item__name { font-size: 13px; font-weight: 600; line-height: 1.3; }
    .checkout-item__meta { font-size: 11px; opacity: .5; margin-top: 2px; }
    .checkout-item__price { font-size: 13px; font-weight: 700; margin-left: auto; flex-shrink: 0; }
    .checkout-summary__line { display: flex; justify-content: space-between; font-size: 13px; opacity: .6; margin-bottom: 10px; }
    .checkout-summary__total { display: flex; justify-content: space-between; font-size: 16px; font-weight: 700; border-top: 1px solid rgba(255,255,255,.1); padding-top: 14px; margin-top: 4px; }
    .checkout-summary__vat { font-size: 11px; opacity: .35; margin-top: 4px; text-align: right; }
    .checkout-empty { text-align: center; padding: 60px 20px; opacity: .5; }
    .checkout-empty h3 { margin: 12px 0 8px; }
    .checkout-empty a { color: #fff; font-size: 13px; }

    .checkout-back { display: inline-flex; align-items: center; gap: 8px; color: rgba(255,255,255,.5); text-decoration: none; font-size: 13px; margin-bottom: 40px; transition: color .2s; }
    .checkout-back:hover { color: #fff; }
    .checkout-back svg { flex-shrink: 0; }

    .same-as-shipping { display: flex; align-items: center; gap: 10px; font-size: 13px; opacity: .7; cursor: pointer; margin-top: 4px; }
    .same-as-shipping input { width: auto; }

    h1.checkout-heading { font-family: var(--font-heading, 'Montserrat', sans-serif); font-size: clamp(28px, 4vw, 42px); font-weight: 700; letter-spacing: -.01em; margin-bottom: 40px; }
  </style>
</head>
<body>
  <div class="checkout-page">
    <div class="checkout-page__inner">

      <!-- ── Left: Form ── -->
      <div class="checkout-form-wrap">
        <a href="javascript:history.back()" class="checkout-back">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          Back to cart
        </a>

        <h1 class="checkout-heading">Checkout</h1>

        <form id="checkout-form" novalidate>

          <!-- Contact -->
          <div class="checkout-section">
            <p class="checkout-section__title">Contact</p>
            <div class="form-row form-row--single">
              <div class="form-group">
                <label for="co-email">Email address</label>
                <input type="email" id="co-email" name="email" placeholder="you@example.com" required autocomplete="email" />
              </div>
            </div>
            <label class="same-as-shipping" style="margin-top:10px">
              <input type="checkbox" id="co-newsletter" checked />
              Subscribe to the HABÄNE newsletter
            </label>
          </div>

          <div class="checkout-divider"></div>

          <!-- Shipping Address -->
          <div class="checkout-section">
            <p class="checkout-section__title">Shipping address</p>
            <div class="form-row">
              <div class="form-group">
                <label for="co-first-name">First name</label>
                <input type="text" id="co-first-name" name="first_name" placeholder="Anna" required autocomplete="given-name" />
              </div>
              <div class="form-group">
                <label for="co-last-name">Last name</label>
                <input type="text" id="co-last-name" name="last_name" placeholder="Weber" required autocomplete="family-name" />
              </div>
            </div>
            <div class="form-row form-row--single" style="margin-top:12px">
              <div class="form-group">
                <label for="co-line1">Address line 1</label>
                <input type="text" id="co-line1" name="line1" placeholder="Hauptstraße 1" required autocomplete="address-line1" />
              </div>
            </div>
            <div class="form-row form-row--single" style="margin-top:12px">
              <div class="form-group">
                <label for="co-line2">Address line 2 (optional)</label>
                <input type="text" id="co-line2" name="line2" placeholder="Apt, suite, etc." autocomplete="address-line2" />
              </div>
            </div>
            <div class="form-row" style="margin-top:12px">
              <div class="form-group">
                <label for="co-postal">Postal code</label>
                <input type="text" id="co-postal" name="postal_code" placeholder="10115" required autocomplete="postal-code" />
              </div>
              <div class="form-group">
                <label for="co-city">City</label>
                <input type="text" id="co-city" name="city" placeholder="Berlin" required autocomplete="address-level2" />
              </div>
            </div>
            <div class="form-row" style="margin-top:12px">
              <div class="form-group">
                <label for="co-state">State / Region (optional)</label>
                <input type="text" id="co-state" name="state" placeholder="BE" autocomplete="address-level1" />
              </div>
              <div class="form-group">
                <label for="co-country">Country</label>
                <select id="co-country" name="country" required autocomplete="country">
                  <option value="DE" selected>Germany</option>
                  <option value="AT">Austria</option>
                  <option value="CH">Switzerland</option>
                  <option value="FR">France</option>
                  <option value="NL">Netherlands</option>
                  <option value="BE">Belgium</option>
                  <option value="IT">Italy</option>
                  <option value="ES">Spain</option>
                  <option value="PL">Poland</option>
                  <option value="SE">Sweden</option>
                  <option value="NO">Norway</option>
                  <option value="DK">Denmark</option>
                  <option value="FI">Finland</option>
                  <option value="GB">United Kingdom</option>
                  <option value="US">United States</option>
                  <option value="CA">Canada</option>
                  <option value="AU">Australia</option>
                  <option value="JP">Japan</option>
                  <option value="SG">Singapore</option>
                  <option value="AE">United Arab Emirates</option>
                </select>
              </div>
            </div>
            <div class="form-row form-row--single" style="margin-top:12px">
              <div class="form-group">
                <label for="co-phone">Phone (optional)</label>
                <input type="tel" id="co-phone" name="phone" placeholder="+49 30 0000000" autocomplete="tel" />
              </div>
            </div>
          </div>

          <div class="checkout-divider"></div>

          <!-- Discount code -->
          <div class="checkout-section">
            <p class="checkout-section__title">Discount code</p>
            <div class="discount-row">
              <div class="form-group" style="flex:1;margin:0">
                <input type="text" id="co-discount" placeholder="e.g. WELCOME10" autocomplete="off" style="text-transform:uppercase" />
              </div>
              <button type="button" id="co-discount-apply">Apply</button>
            </div>
            <p class="discount-msg" id="co-discount-msg" hidden></p>
          </div>

          <div class="checkout-divider"></div>

          <!-- GDPR consent -->
          <div class="checkout-section">
            <label class="same-as-shipping">
              <input type="checkbox" id="co-gdpr" required />
              I agree to the <a href="privacy.html" target="_blank" style="color:rgba(255,255,255,.7);text-decoration:underline">Privacy Policy</a> and <a href="terms.html" target="_blank" style="color:rgba(255,255,255,.7);text-decoration:underline">Terms & Conditions</a>
            </label>
          </div>

          <div class="checkout-error" id="co-error"></div>

          <button type="submit" class="checkout-submit" id="co-submit">
            Proceed to payment →
          </button>
          <p class="checkout-notice">
            You will be redirected to Stripe's secure payment page.<br />
            Prices are calculated server-side. VAT included.
          </p>
        </form>
      </div>

      <!-- ── Right: Order Summary ── -->
      <div class="checkout-summary-wrap">
        <div class="checkout-summary">
          <p class="checkout-summary__title">Your order</p>
          <div class="checkout-summary__items" id="co-items">
            <div class="checkout-empty">
              <h3>Cart is empty</h3>
              <a href="shop.html">← Back to shop</a>
            </div>
          </div>
          <div id="co-totals" hidden>
            <div class="checkout-summary__line"><span>Subtotal</span><span id="co-subtotal">—</span></div>
            <div class="checkout-summary__line" id="co-discount-line" hidden><span>Discount</span><span id="co-discount-amount" style="color:#4ade80">—</span></div>
            <div class="checkout-summary__line"><span>Shipping</span><span id="co-shipping">Calculated at checkout</span></div>
            <div class="checkout-summary__total"><span>Total</span><span id="co-total">—</span></div>
            <p class="checkout-summary__vat">Incl. VAT</p>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div class="toast" data-toast role="status" aria-live="polite"></div>

  <script src="assets/api.js"></script>
  <script>
    (function () {
      var api  = window.habaneApi;
      var cart = window.habaneCart;
      var fmt  = window.habaneFormatPrice || function (n) { return '€' + Number(n).toFixed(2); };
      var toast = function (msg) { var el = document.querySelector('[data-toast]'); if (!el) return; el.textContent = msg; el.classList.add('is-visible'); clearTimeout(toast._t); toast._t = setTimeout(function () { el.classList.remove('is-visible'); }, 2400); };

      // ── Render cart summary ───────────────────────────────────────
      function renderSummary() {
        var items = cart ? cart.get() : [];
        var itemsEl = document.getElementById('co-items');
        var totalsEl = document.getElementById('co-totals');

        if (!items.length) {
          itemsEl.innerHTML = '<div class="checkout-empty"><h3>Cart is empty</h3><a href="shop.html">← Back to shop</a></div>';
          totalsEl.hidden = true;
          return;
        }

        var subtotal = cart.subtotal();
        var itemsHtml = items.map(function (item) {
          var img = item.image
            ? '<img class="checkout-item__img" src="' + item.image + '" alt="' + item.name + '" loading="lazy" />'
            : '<div class="checkout-item__img-placeholder"></div>';
          var meta = [item.color, item.size, 'Qty: ' + item.quantity].filter(Boolean).join(' · ');
          return '<div class="checkout-item">' + img + '<div style="flex:1;min-width:0"><div class="checkout-item__name">' + item.name + '</div><div class="checkout-item__meta">' + meta + '</div></div><div class="checkout-item__price">' + fmt(item.price * item.quantity) + '</div></div>';
        }).join('');

        itemsEl.innerHTML = itemsHtml;
        totalsEl.hidden = false;
        document.getElementById('co-subtotal').textContent = fmt(subtotal);
        document.getElementById('co-total').textContent = fmt(subtotal); // Stripe will recalculate
      }

      renderSummary();

      // ── Discount code validation ──────────────────────────────────
      var _discountAmount = 0;
      var _discountCode   = '';

      document.getElementById('co-discount-apply').onclick = function () {
        var code = (document.getElementById('co-discount').value || '').trim().toUpperCase();
        var msgEl = document.getElementById('co-discount-msg');
        var discountLine = document.getElementById('co-discount-line');
        if (!code) return;

        this.disabled = true; this.textContent = 'Checking…';
        var btn = this;
        var subtotal = cart ? cart.subtotal() : 0;

        api.validateDiscount(code, subtotal)
          .then(function (result) {
            btn.disabled = false; btn.textContent = 'Apply';
            msgEl.hidden = false;
            if (result.valid) {
              _discountAmount = result.discount_amount || 0;
              _discountCode = code;
              msgEl.className = 'discount-msg is-valid';
              msgEl.textContent = result.type === 'percent'
                ? result.value + '% off — saving ' + fmt(_discountAmount)
                : fmt(_discountAmount) + ' off applied';
              discountLine.hidden = false;
              document.getElementById('co-discount-amount').textContent = '−' + fmt(_discountAmount);
              document.getElementById('co-total').textContent = fmt(Math.max(0, subtotal - _discountAmount));
            } else {
              _discountAmount = 0; _discountCode = '';
              msgEl.className = 'discount-msg is-invalid';
              msgEl.textContent = result.reason || 'Invalid discount code.';
              discountLine.hidden = true;
            }
          })
          .catch(function (err) {
            btn.disabled = false; btn.textContent = 'Apply';
            msgEl.hidden = false; msgEl.className = 'discount-msg is-invalid';
            msgEl.textContent = err.message || 'Could not validate code.';
          });
      };

      // Allow pressing Enter in discount field
      document.getElementById('co-discount').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); document.getElementById('co-discount-apply').click(); }
      });

      // ── Form submission → createCheckout ─────────────────────────
      document.getElementById('checkout-form').addEventListener('submit', function (e) {
        e.preventDefault();

        var items = cart ? cart.toApiItems() : [];
        if (!items.length) { toast('Your cart is empty.'); return; }

        var gdpr = document.getElementById('co-gdpr');
        if (!gdpr.checked) { toast('Please accept the Privacy Policy and Terms & Conditions.'); return; }

        var errorEl = document.getElementById('co-error');
        var submitBtn = document.getElementById('co-submit');
        errorEl.style.display = 'none';
        submitBtn.disabled = true;
        submitBtn.textContent = 'Processing…';

        var shippingAddress = {
          first_name:  document.getElementById('co-first-name').value.trim(),
          last_name:   document.getElementById('co-last-name').value.trim(),
          line1:       document.getElementById('co-line1').value.trim(),
          line2:       document.getElementById('co-line2').value.trim() || undefined,
          postal_code: document.getElementById('co-postal').value.trim(),
          city:        document.getElementById('co-city').value.trim(),
          state:       document.getElementById('co-state').value.trim() || undefined,
          country:     document.getElementById('co-country').value,
          phone:       document.getElementById('co-phone').value.trim() || undefined
        };

        var input = {
          items:              items,
          email:              document.getElementById('co-email').value.trim(),
          shipping_address:   shippingAddress,
          discount_code:      _discountCode || undefined,
          newsletter_opt_in:  document.getElementById('co-newsletter').checked,
          gdpr_consent_text:  'Privacy policy and Terms & Conditions accepted at checkout.',
          success_url:        location.origin + location.pathname.replace('checkout.html', '') + 'checkout-success.html?order={CHECKOUT_SESSION_ID}',
          cancel_url:         location.origin + location.pathname.replace('checkout.html', '') + 'checkout.html'
        };

        api.createCheckout(input)
          .then(function (session) {
            // Store order number for success page polling
            try { sessionStorage.setItem('habane_last_order', session.order_number); } catch (e) {}
            try { sessionStorage.setItem('habane_last_email', input.email); } catch (e) {}

            if (session.checkout_url) {
              // Stripe redirect
              cart.clear();
              window.location.href = session.checkout_url;
            } else {
              // Stripe not configured — order created as pending
              cart.clear();
              window.location.href = 'checkout-success.html?order=' + encodeURIComponent(session.order_number) + '&email=' + encodeURIComponent(input.email) + '&no_stripe=1';
            }
          })
          .catch(function (err) {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Proceed to payment →';
            errorEl.style.display = 'block';
            if (err.code === 'conflict') {
              errorEl.textContent = err.message || 'Some items are out of stock. Please update your cart.';
            } else if (err.code === 'validation_error') {
              errorEl.textContent = 'Please check all fields and try again. ' + (err.message || '');
            } else if (err.code === 'unavailable') {
              errorEl.textContent = 'Stripe payments are not yet configured. Your order has been saved as pending — we\'ll contact you shortly.';
              // Still try to create a plain order
              var plainInput = Object.assign({}, input);
              delete plainInput.success_url; delete plainInput.cancel_url;
              api.createOrder(plainInput).then(function (order) {
                cart.clear();
                window.location.href = 'checkout-success.html?order=' + encodeURIComponent(order.order_number) + '&email=' + encodeURIComponent(input.email) + '&no_stripe=1';
              }).catch(function () {});
            } else {
              errorEl.textContent = err.message || 'Something went wrong. Please try again.';
            }
          });
      });

    })();
  </script>
</body>
</html>
